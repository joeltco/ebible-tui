[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebible"
version = "1.0.0"
description = "Offline Amharic / English Ethiopian Orthodox Bible reader for the terminal"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joel" }]
# No network dependency: the text ships compiled into the package.
dependencies = [
  "textual>=1.0",
  "rich>=13.7",
]

[project.scripts]
ebible = "ebible.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ebible*"]

# The compiled database is the whole point of the package -- ship it.
[tool.setuptools.package-data]
ebible = ["data/*.db", "data/*.sql", "ui/*.tcss"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "A", "C4"]
ignore = ["E203", "E266", "E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
pretty = true
ignore_missing_imports = true

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
