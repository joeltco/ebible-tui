[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebible-tui"
version = "0.1.0"
description = "Amharic Bible TUI with on-the-spot translation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Joel"}]
dependencies = [
  "textual>=0.62",   # TUI framework
  "rich>=13.7.1",    # colors/markup (Textual uses Rich)
  "pyyaml>=6.0.1"    # simple config handling
]

[project.scripts]
ebible = "ebible_tui.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ebible_tui*"]

[tool.ruff]
target-version = "py311"
src = ["ebible_tui"]
extend-exclude = ["ebible_tui/assets"]
line-length = 100
fix = true
[tool.ruff.lint]
select = ["E","F","I","UP","B","N","A","C4"]
ignore = ["E203","E266","E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
pretty = true
show_error_context = true
plugins = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
