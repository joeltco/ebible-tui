[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebible"
version = "2.0.0.dev0"
description = "Amharic reader with on-demand verse translation for the 81-book Ethiopian Orthodox canon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8", "rich>=13.7"]

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov", "build"]

[project.scripts]
ebible = "ebible.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebible = ["data/*.db", "data/*.sql", "ui/styles/*.tcss", "core/translate/TRANSLATION_GUIDE.md", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
